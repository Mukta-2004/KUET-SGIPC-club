<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SGIPC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>SGIPC</h1>
    </nav>

    <section class="form-section">
        <h2>Join SGIPC</h2>

        <form>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email" required>
            <input type="text" placeholder="Contact Number" required>
            <input type="text" placeholder="Institute" required>
            <input type="text" placeholder="Department" required>
            <input type="text" placeholder="Batch" required>
            <input type="text" placeholder="Student ID" required>
            <input type="text" placeholder="Codeforces Handle" required>

            <textarea placeholder="Your Comment" rows="4"></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>

</body>
</html>
